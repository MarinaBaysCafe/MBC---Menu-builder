<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style id="pst"></style>
<style>
:root{--bg:#f1ece4;--sf:#fff;--tx:#241f1b;--mu:#7b726b;--ln:#e7dfd5;--ac:#1b4a63;--on:#fff;--sh:0 1px 2px rgba(36,31,27,.06),0 6px 18px rgba(36,31,27,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171412;--sf:#221e1b;--tx:#f2ebe4;--mu:#a39a92;--ln:#37312c;--ac:#6fb1d1;--on:#0e202a;--sh:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#171412;--sf:#221e1b;--tx:#f2ebe4;--mu:#a39a92;--ln:#37312c;--ac:#6fb1d1;--on:#0e202a;--sh:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--sf);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.lgo{width:38px;height:38px;object-fit:contain}
.ttl b{display:block;font-size:15px;letter-spacing:-.01em}.ttl span{font-size:12px;color:var(--mu)}
.pills{display:flex;gap:6px;flex-wrap:wrap}.sp{flex:1}
.pill{border-radius:99px;padding:6px 14px;font-weight:500}
.pill.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.zm{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mu)}.zm input{width:110px;accent-color:var(--ac)}
.app{display:grid;grid-template-columns:470px 1fr;align-items:start}
#ed{position:sticky;top:0;max-height:100vh;overflow:auto;padding:16px;background:var(--bg);border-right:1px solid var(--ln)}
#pv{min-width:0;overflow-x:auto;padding:24px;display:flex;flex-direction:column;align-items:center;gap:22px}
@media(max-width:900px){.app{display:block}#ed{position:static;max-height:none;border:0}#pv{padding:12px 0}}
button,.btn{font:inherit;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:8px;padding:6px 11px;transition:.15s;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--ac);color:var(--ac)}
.pri{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}.pri:hover{opacity:.9;color:var(--on)}
.ghost{background:none;border-color:transparent;color:var(--mu)}
.ic{width:28px;height:28px;padding:0;justify-content:center;flex:none}
.dng:hover,.armed{background:#c0392b!important;color:#fff!important;border-color:#c0392b!important;width:auto;padding:0 8px}
input[type=text],input[type=number],select,textarea{font:inherit;font-size:13px;width:100%;min-width:0;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:8px;padding:6px 9px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
input[type=color]{width:100%;height:34px;padding:2px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);cursor:pointer}
.seg{display:flex;background:var(--ln);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--mu);justify-content:center;font-weight:600}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:var(--sh)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin-bottom:12px;box-shadow:var(--sh)}
.chd{display:flex;gap:6px;align-items:center;padding:10px 12px}
.cbd{display:none;padding:2px 14px 14px}.card.open .cbd{display:block}
.card.open [data-a=tog]{transform:rotate(90deg)}
.tt{font-weight:600;border-color:transparent;background:transparent}.tt:hover{border-color:var(--ln)}
.bdg{font-size:11px;color:var(--mu);background:var(--bg);border-radius:99px;padding:2px 8px}
.lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);margin:14px 0 6px}
.rw{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.it{border-top:1px solid var(--ln);padding:10px 0;display:grid;gap:7px}
.pr{display:flex;gap:6px;flex-wrap:wrap}
.pr label{flex:1 1 72px;font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;display:grid;gap:3px}
.chip{display:inline-flex;gap:5px;align-items:center;font-size:12px;padding:3px 10px;border:1px solid var(--ln);border-radius:99px;cursor:pointer;color:var(--mu)}
.chip input{display:none}.chip:has(input:checked){background:color-mix(in srgb,var(--ac) 14%,transparent);border-color:var(--ac);color:var(--ac);font-weight:600}
.cc{display:flex;gap:2px;align-items:center;width:150px}
.fl{display:grid;gap:4px;margin:8px 0;font-size:12px;color:var(--mu)}
.g2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sw{width:44px;height:30px;border-radius:8px;padding:0;border:2px solid var(--ln)}
.adj{background:var(--bg);border-radius:10px;padding:6px 8px;font-size:12px;color:var(--mu)}.adj input{width:70px}.adj select{width:auto}
/* menu page */
.pg{width:794px;height:1123px;background:var(--pp);color:var(--pi);padding:52px 64px 36px;font-family:var(--pf);zoom:var(--z);box-shadow:0 4px 24px rgba(36,31,27,.18);display:flex;flex-direction:column;flex:none;overflow:hidden;--pm:color-mix(in srgb,var(--pi) 55%,var(--pp))}
.pg .bd{flex:1}.pg .hd{text-align:center;margin-bottom:22px}
.pg .hd img{display:block;margin:0 auto 10px;height:64px;max-width:200px;object-fit:contain}
.pg h1{font-size:17px;letter-spacing:.32em;margin:0 0 3px;font-weight:700}
.pg .tg{font-size:12px;color:var(--pm);font-style:italic}
.pg hr{width:50px;border:0;border-top:1px solid var(--pa);margin:10px auto 12px}
.pg h2{font-size:26px;font-style:italic;font-weight:400;margin:0;line-height:1.2}
.pg h3{font-size:12.5px;letter-spacing:.18em;margin:16px 0 0;padding-bottom:7px;border-bottom:1px solid var(--pa);text-transform:uppercase;line-height:1.3}
.pg h3 em{font-size:11px;letter-spacing:0;font-weight:400;color:var(--pm);text-transform:none;margin-left:8px}
.pg .ch,.pg .ir{display:grid;column-gap:8px;align-items:baseline;padding-left:34px}
.pg .ch{font:9px/1.2 Inter,system-ui,sans-serif;letter-spacing:.1em;color:var(--pm);text-align:right;padding-top:6px;padding-bottom:2px}
.pg .ir{position:relative;padding-top:3px;padding-bottom:3px;border-bottom:1px solid color-mix(in srgb,var(--pi) 10%,var(--pp));font-size:14px;line-height:1.2}
.pg .ir:last-child{border-bottom:0}
.pg .ir small{font-size:10.5px;font-style:italic;color:var(--pm);line-height:1.3}.pg .ir small.b{display:block}
.pg .ir .p{text-align:right;font-variant-numeric:tabular-nums}
.pg .bs{position:absolute;left:8px;top:4px;color:var(--pa);font-size:14px;line-height:1}
.pg .bs svg,.pg .lg svg{display:block}
.pg .nw{font:700 8px Inter,system-ui,sans-serif;letter-spacing:.1em;color:var(--pp);background:var(--pa);border-radius:3px;padding:1px 4px;margin-left:6px;vertical-align:2px}
.pg .lg{align-self:flex-end;flex:none;margin-top:10px;border:1px solid var(--pa);color:var(--pa);border-radius:12px;padding:6px 14px;font:700 10px Inter,system-ui,sans-serif;display:flex;gap:26px;align-items:center}
@media print{
 .top,#ed{display:none}body,.app{display:block;height:auto;background:none}
 #pv{padding:0;display:block;overflow:visible}
 .pg{zoom:1!important;box-shadow:none;break-after:page;margin:0;height:calc(var(--h) - 1px)!important}
}
</style></head><body>
