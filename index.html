<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marina Bay's Cafe Menu Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ece2;--pn:#fdfbf8;--tx:#2b2420;--mu:#7a6f68;--ln:#e2d6c8;--ac:#1b4a63;--br:#a67c52;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--pn:#292524;--tx:#f0e9e2;--mu:#a8a098;--ln:#44403c;--ac:#6fb1d1;--br:#c49a6c;--on:#10222d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif}
.app{display:grid;grid-template-columns:420px 1fr;height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr;height:auto}}
#ed{overflow:auto;padding:12px;background:var(--pn);border-right:1px solid var(--ln)}
#pv{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px;align-items:center}
.brand{display:flex;gap:10px;align-items:center;margin:0 0 12px;padding-bottom:10px;border-bottom:2px solid var(--br)}.brand img{width:44px;height:44px}.brand b{display:block;font:700 13px 'Noto Serif',Georgia,serif;letter-spacing:.22em}.brand i{font:italic 12px 'Noto Serif',Georgia,serif;color:var(--mu)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:6px;padding:4px 9px}
button:hover{border-color:var(--br)}
button.on,button.pri{background:var(--ac);color:var(--on);border-color:var(--ac)}
input:focus,textarea:focus{outline:2px solid var(--br);outline-offset:0}
button.x{color:#c0392b}
input[type=text]{font:inherit;width:100%;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:5px;padding:4px 6px;min-width:0}
.card{border:1px solid var(--ln);border-left:3px solid var(--br);border-radius:8px;padding:8px;margin-bottom:10px}
.row{display:flex;gap:6px;align-items:center;margin:4px 0}
.it{display:grid;grid-template-columns:1fr;gap:3px;border-top:1px dashed var(--ln);padding:6px 0}
.pr{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pr input[type=text]{width:58px}
label.s{font-size:12px;color:var(--mu);display:flex;gap:4px;align-items:center;white-space:nowrap}
#io{display:none;width:100%;height:110px;margin-bottom:8px;font:12px monospace}
.pg{width:794px;height:1123px;background:#fdfbf8;color:#2b2420;padding:52px 64px 36px;display:flex;flex-direction:column;box-shadow:0 2px 12px rgba(43,36,32,.12);font-family:'Noto Serif',Georgia,serif;border:1px solid #e6e0d8;zoom:.7;position:relative;flex:none;overflow:hidden}
.pg .bd{flex:1}
.pg .hd{text-align:center;margin-bottom:22px}
.pg .hd img{display:block;margin:0 auto 10px}
.pg h1{font-size:17px;letter-spacing:.32em;margin:0 0 3px;font-weight:700}
.pg .tg{font-size:12px;color:#7a6f68;font-style:italic}
.pg hr{width:50px;border:0;border-top:1px solid #a67c52;margin:10px auto 12px}
.pg h2{font-size:26px;font-style:italic;font-weight:400;margin:0;line-height:1.2}
.pg h3{font-size:12.5px;letter-spacing:.18em;margin:16px 0 0;padding-bottom:7px;border-bottom:1px solid #b9958c;text-transform:uppercase;line-height:1.3}
.pg h3 em{font-size:11px;letter-spacing:0;font-weight:400;color:#7a6f68;text-transform:none;margin-left:8px}
.pg .ch,.pg .ir{display:grid;column-gap:8px;align-items:baseline;padding-left:34px}
.pg .ch{font-family:system-ui,sans-serif;font-size:9px;letter-spacing:.1em;color:#7a6f68;text-align:right;padding-top:6px;padding-bottom:2px}
.pg .ir{position:relative;padding-top:3px;padding-bottom:3px;border-bottom:1px solid #eee7df;font-size:14px;line-height:1.2}
.pg .ir:last-child{border-bottom:0}
.pg .ir small{font-size:10.5px;font-style:italic;color:#7a6f68;line-height:1.3}
.pg .ir small.b{display:block}
.pg .ir .p{text-align:right;font-variant-numeric:tabular-nums}
.pg .bs{position:absolute;left:8px;top:4px;color:#8a5a44;font-size:14px;line-height:1}
.pg .bs svg,.pg .lg svg{display:block}
.pg .lg{align-self:flex-end;flex:none;margin-top:10px;border:1px solid #a67c52;border-radius:12px;padding:6px 14px;font-size:10px;font-weight:700;display:flex;gap:26px;align-items:center}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff}.app{display:block;height:auto}#ed{display:none}
 #pv{padding:0;display:block;overflow:visible}
 .pg{zoom:1;border:0;box-shadow:none;width:210mm;min-height:297mm;height:297mm;break-after:page;overflow:hidden;padding-left:22mm;padding-right:22mm}
}
</style></head><body>

function paginate(m){const ps=[[]];let h=0;m.sec.forEach(s=>{const inl=s.cols.some(x=>x);const c=40+(inl?18:0)+s.it.reduce((a,i)=>a+(inl?24:(i.d?38:24)),0);const p=ps[ps.length-1];if(p.length&&(s.pb||h+c>770)){ps.push([]);h=0}ps[ps.length-1].push(s);h+=c});return ps}
function preview(){
 const m=M();
 $('pv').innerHTML=paginate(m).map(p=>{
  const body=p.map(s=>{
   const inl=s.cols.some(x=>x),n=s.cols.length;
   const g=`grid-template-columns:${inl?'210px 1fr':'1fr'} repeat(${n},62px)`;
   const lab=inl?`<div class="ch" style="${g}"><span></span><span></span>${s.cols.map(c=>`<span>${E(c)}</span>`).join('')}</div>`:'';
   return `<h3>${E(s.t)}${s.s?`<em>(${E(s.s)})</em>`:''}</h3>${lab}`+s.it.map(i=>`<div class="ir" style="${g}">${i.b?'<span class="bs">'+ANC+'</span>':''}${inl?`<span>${E(i.n)}</span><small>${E(i.d)}</small>`:`<span>${E(i.n)}${i.d?`<small class="b">${E(i.d)}</small>`:''}</span>`}${s.cols.map((c,k)=>`<span class="p">${E(i.p[k]||'')}</span>`).join('')}</div>`).join('');
  }).join('');
  return `<section class="pg"><div class="hd">${LOGO}<h1>MARINA BAY'S CAFE</h1><div class="tg">Calm in every cup</div><hr><h2>${E(m.name)}</h2></div><div class="bd">${body}</div><div class="lg">BEST SELLER <span style="font-size:15px;display:flex">${ANC}</span></div></section>`;
 }).join('');
}
function editor(){
 const m=M();
 let h=`<div class="brand">${LOGO}<div><b>MARINA BAY'S CAFE</b><i>Menu Builder</i></div></div><div class="bar">${S.menus.map((x,i)=>`<button data-a="tab" data-m="${i}" class="${i==cur?'on':''}">${E(x.name)}</button>`).join('')}<button data-a="addMenu">+ Menu</button></div>
 <div class="bar"><button class="pri" data-a="print">Print / Save PDF</button><button data-a="exp">Export data</button><button data-a="imp">Import data</button><button data-a="reset" class="x">Reset</button></div>
 <textarea id="io"></textarea>
 <div class="row"><label class="s">Menu title</label><input type="text" data-f="mname" value="${E(m.name)}"><button class="x" data-a="delMenu">Delete menu</button></div>`;
 m.sec.forEach((s,si)=>{
  h+=`<div class="card"><div class="row"><input type="text" data-s="${si}" data-f="t" value="${E(s.t)}" placeholder="Section title"><button data-a="upS" data-s="${si}">↑</button><button data-a="dnS" data-s="${si}">↓</button><button class="x" data-a="delS" data-s="${si}">✕</button></div>
  <div class="row"><input type="text" data-s="${si}" data-f="s" value="${E(s.s)}" placeholder="Subtitle (shown in brackets)"></div>
  <div class="row"><input type="text" data-s="${si}" data-f="cols" value="${E(s.cols.join(', '))}" placeholder="Price columns, comma separated"><label class="s"><input type="checkbox" data-s="${si}" data-f="pb" ${s.pb?'checked':''}>New page</label></div>`;
  s.it.forEach((i,ii)=>{
   h+=`<div class="it"><div class="row"><input type="text" data-s="${si}" data-i="${ii}" data-f="n" value="${E(i.n)}" placeholder="Item name"><button data-a="upI" data-s="${si}" data-i="${ii}">↑</button><button data-a="dnI" data-s="${si}" data-i="${ii}">↓</button><button class="x" data-a="delI" data-s="${si}" data-i="${ii}">✕</button></div>
   <input type="text" data-s="${si}" data-i="${ii}" data-f="d" value="${E(i.d)}" placeholder="Description (optional)">
   <div class="pr">${s.cols.map((c,k)=>`<input type="text" data-s="${si}" data-i="${ii}" data-f="p" data-c="${k}" value="${E(i.p[k]||'')}" placeholder="${E(c)||'Price'}" title="${E(c)}">`).join('')}<label class="s"><input type="checkbox" data-s="${si}" data-i="${ii}" data-f="b" ${i.b?'checked':''}>Best seller</label></div></div>`;
  });
  h+=`<button data-a="addI" data-s="${si}">+ Item</button></div>`;
 });
 h+=`<button class="pri" data-a="addS">+ Section</button>`;
 $('ed').innerHTML=h;
}
const mv=(a,i,d)=>{const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]};
$('ed').addEventListener('input',e=>{
 const d=e.target.dataset,f=d.f;if(!f)return;
 const v=e.target.type=='checkbox'?e.target.checked:e.target.value;
 if(f=='mname')M().name=v;
 else if(f=='cols')return;
 else{const s=M().sec[d.s];
  if(d.i===undefined)s[f]=v;
  else{const it=s.it[d.i];if(f=='p')it.p[d.c]=v;else it[f]=v}}
 save();preview();
});
$('ed').addEventListener('change',e=>{
 const d=e.target.dataset;
 if(d.f=='cols'){const s=M().sec[d.s];s.cols=e.target.value.split(',').map(x=>x.trim());if(!s.cols.length)s.cols=[''];s.it.forEach(i=>{while(i.p.length<s.cols.length)i.p.push('')});save();editor();preview()}
});
$('ed').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const d=b.dataset,a=d.a,m=M(),s=m.sec[d.s];let re=1;
 if(a=='tab')cur=+d.m;
 else if(a=='addMenu'){const n=prompt('Menu name?');if(!n)return;S.menus.push({name:n,sec:[]});cur=S.menus.length-1}
 else if(a=='delMenu'){if(S.menus.length<2||!confirm('Delete this menu?'))return;S.menus.splice(cur,1);cur=0}
 else if(a=='addS')m.sec.push(SEC('New Section','',[''],[I('New Item','',0,'')]));
 else if(a=='delS'){if(confirm('Delete section?'))m.sec.splice(d.s,1);else return}
 else if(a=='upS')mv(m.sec,+d.s,-1);
 else if(a=='dnS')mv(m.sec,+d.s,1);
 else if(a=='addI')s.it.push(I('New Item','',0,...s.cols.map(()=>'')));
 else if(a=='delI')s.it.splice(d.i,1);
 else if(a=='upI')mv(s.it,+d.i,-1);
 else if(a=='dnI')mv(s.it,+d.i,1);
 else if(a=='print'){window.print();return}
 else if(a=='exp'){const t=$('io');t.style.display='block';t.value=JSON.stringify(S);t.select();try{document.execCommand('copy')}catch(x){}return}
 else if(a=='imp'){const t=$('io');if(t.style.display!='block'){t.style.display='block';t.value='';t.placeholder='Paste exported data here, then press Import again';return}try{const j=JSON.parse(t.value);if(!j.menus)throw 0;S=j;cur=0}catch(x){alert('That data is not valid.');return}}
 else if(a=='reset'){if(!confirm('Reset everything to the original menus?'))return;S=JSON.parse(JSON.stringify(DEF));cur=0}
 save();editor();preview();
});
editor();preview();
</script>
